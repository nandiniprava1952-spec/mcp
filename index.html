<title>MCP Card — Photo Kit</title>
<style>
:root{--bg:#f6f7f9;--fg:#111827;--mu:#6b7280;--card:#fff;--br:#e5e7eb;--ac:#0f766e;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0b1115;--fg:#e5e7eb;--mu:#9ca3af;--card:#151c22;--br:#26313a}}
*{box-sizing:border-box}html,body{margin:0}
body{font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:12px 16px;background:var(--ac);color:#fff}
header h1{flex:1;min-width:0;font-size:18px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header a{color:#fff;font-size:30px;line-height:1;text-decoration:none;padding:0 8px 4px 0}
main{max-width:640px;margin:auto;padding:16px 16px calc(80px + env(safe-area-inset-bottom))}
label{display:block;font-size:14px;color:var(--mu);margin:12px 0}
input:not([type=file]){display:block;width:100%;font:inherit;padding:12px;margin-top:4px;border:1px solid var(--br);border-radius:10px;background:var(--card);color:var(--fg)}
.b{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:48px;margin:8px 0;padding:0 16px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:600 16px system-ui;text-decoration:none;cursor:pointer}
.s{background:var(--card);color:var(--fg);border:1px solid var(--br)}.d{background:#b91c1c}
.row,.nav{display:flex;gap:8px}.row .b,.nav>*{flex:1}
.c{display:flex;align-items:center;gap:12px;padding:10px 12px;margin:8px 0;min-height:60px;background:var(--card);border:1px solid var(--br);border-radius:12px;color:inherit;text-decoration:none}
.c div{flex:1;min-width:0}.c span{display:block}.c em{font-style:normal}
.c img,.c i{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none;display:grid;place-items:center;background:var(--br);font-style:normal;font-weight:700;color:var(--mu)}
.ok{border-color:var(--ac)}.mu{color:var(--mu);font-size:13px}
.ref{width:100%;border-radius:12px;border:1px solid var(--br);background:var(--card);min-height:80px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.t{position:relative}
.t img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.t button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:30px;height:30px}
progress{width:100%;accent-color:var(--ac)}h2{font-size:16px;margin:24px 0 8px}
.note{padding:12px;border-radius:10px;background:var(--card);border:1px solid var(--br)}
#cv{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;padding:24px 24px calc(32px + env(safe-area-inset-bottom));color:#fff;background:linear-gradient(#4a4a38,#1b241f)}
#cv[hidden]{display:none}
#cv>img{position:absolute;top:0;left:0;width:100%;height:min(55vh,112vw);object-fit:cover;object-position:88% 0;-webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent)}
#cx{position:relative;text-shadow:0 1px 6px rgba(0,0,0,.6)}#cx h1{font-size:28px;margin:0 0 6px}#cx p{margin:0 0 16px;opacity:.95}
header{padding:10px 12px}
.hb{flex:none;position:relative;width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:10px;background:rgba(255,255,255,.16);color:#fff;font:700 13px system-ui;padding:0;text-decoration:none;cursor:pointer}
.hb[hidden]{display:none}.hb img{width:30px;height:30px;border-radius:7px}
.hb svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#hl,#cl{width:auto;min-width:36px;padding:0 8px}#hbk{font-size:26px;padding-bottom:3px}
#hl{position:fixed;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:6;width:auto;height:40px;padding:0 16px;border-radius:20px;background:var(--ac);box-shadow:0 2px 10px rgba(0,0,0,.35);font-size:14px}
#cl{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;background:rgba(0,0,0,.45)}
#hp{position:absolute;right:-3px;bottom:-3px;min-width:16px;padding:0 4px;border-radius:8px;background:#fff;color:#0f766e;font-size:10px;line-height:16px}#hp:empty{display:none}
.done b{color:#86efac}
#ho{width:auto;padding:0 10px}#ho b{font-size:13px;white-space:nowrap}
#ts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;max-width:90%;padding:10px 16px;border-radius:20px;background:#111;color:#fff;font-size:14px;text-align:center}#ts[hidden]{display:none}
#ub{position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:50;max-width:616px;margin:auto;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:#111;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.4)}#ub[hidden]{display:none}
#cx #ub{position:relative;inset:auto;margin:0 0 16px;max-width:none;text-shadow:none;background:rgba(0,0,0,.65);backdrop-filter:blur(6px)}
#ub span{flex:1;font-size:14px}#ub button{border:0;border-radius:10px;min-height:36px;padding:0 12px;font:600 14px system-ui;cursor:pointer}#ubr{background:#2dd4bf;color:#063}#ubx{background:transparent;color:#fff;font-size:18px!important}
</style></head>

<script>
const PAGES=[[1,"p","MCP Card Cover — RCH/ABHA/UWIN/Aadhaar No., Family Details, Pregnancy Info","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_01.jpg"],[2,"p","Emergency Contact Numbers & Bank Account Details","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_02.jpg"],[3,"p","Pregnant Woman Risk Assessment Checklist (Part 1)","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_03.jpg"],[4,"p","Pregnant Woman Risk Assessment Checklist (Part 2) & Referral Centers","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_04.jpg"],[5,"p","Red Card — Personal Details, High-Risk Status, Current Status & Advice, FRU Referral, Transport","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_05.jpg"],[6,"p","Red Card — Treatment at Institutions, Follow-up Home Visits, Delivery Outcome","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_06.jpg"],[7,"p","Mother's Health Check-up & ANC Visit Table (9 Visits — Vitals, Tests, TT, IFA)","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_07.jpg"],[8,"i","Danger Signs During Pregnancy/Delivery/Postpartum","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_08.jpg"],[9,"p","Post-Delivery Details & Mother's Postpartum Assessment Table (Day 1–42)","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_09.jpg"],[10,"i","Newborn Care & Breastfeeding Guide","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_10.jpg"],[11,"p","Child Care — HBNC Home Visits, Growth Milestones, Referral Details","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_11.jpg"],[12,"i","Complementary Feeding Guide, 6 Months–2 Years","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_12.jpg"],[13,"i","Diarrhoea & Pneumonia Prevention/Danger Signs","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_13.jpg"],[14,"i","DEIC / RBSK Child Screening Services","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_14.jpg"],[15,"p","Developmental Milestone Checklist — Birth to 3 Months","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_15.jpg"],[16,"p","Developmental Milestone Checklist — 3 Months","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_16.jpg"],[17,"p","Developmental Milestone Checklist — 4–6 Months","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_17.jpg"],[18,"p","Developmental Milestone Checklist — 6 Months","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_18.jpg"],[19,"p","Developmental Milestone Checklist — 7–9 Months","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_19.jpg"],[20,"p","Developmental Milestone Checklist — 9 Months","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_20.jpg"],[21,"p","Developmental Milestone Checklist — 10–12 Months","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_21.jpg"],[22,"p","Developmental Milestone Checklist — 12 Months","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_22.jpg"],[23,"p","Developmental Milestone Checklist — 18 Months (Part 1)","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_23.jpg"],[24,"p","Developmental Milestone Checklist — 18 Months (Part 2)","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_24.jpg"],[25,"p","Developmental Milestone Checklist — 24 Months","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_25.jpg"],[26,"p","Developmental Milestone Checklist — 24 Months (Part 2)","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_26.jpg"],[27,"p","Developmental Milestone Checklist — 3 Years (Part 1)","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_27.jpg"],[28,"p","Developmental Milestone Checklist — 3 Years (Part 2)","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_28.jpg"],[29,"p","Nutrition Guidance & Severe Acute Malnutrition Screening (MUAC/Oedema) Table","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_29.jpg"],[30,"p","Immunization Schedule (Birth–16 Years) & Missed-Dose Tracking Table","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_30.jpg"],[31,"p","Growth Chart — Girl, Weight-for-Age (0–5 Years)","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_31.jpg"],[32,"p","Growth Chart — Boy, Weight-for-Age (0–5 Years)","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_32.jpg"],[33,"p","Growth Chart — Girl, Weight-for-Length/Height","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_33.jpg"],[34,"p","Growth Chart — Boy, Weight-for-Length/Height","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_34.jpg"],[35,"p","Janani Suraksha Yojana (JSY) Card — Family Details, ANC, Benefits, Referral","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_35.jpg"],[36,"p","JSY Card — 108/102 Ambulance Services & Delivery Details","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_36.jpg"],[37,"p","ANC Visit Table — Duplicate/Tear-off Copy","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_37.jpg"],[38,"p","Immunization Schedule — Duplicate Tear-off Slip (Anganwadi/ASHA Copy)","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_38.jpg"],[39,"p","Immunization Schedule — Duplicate Tear-off Slips (AWW & ASHA Copies)","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_39.jpg"],[40,"i","Vaccination Guidance & Reminders","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_40.jpg"],[41,"p","IFA & Calcium Tablet Compliance Tracker — Pregnancy (180 Days)","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_41.jpg"],[42,"p","IFA & Calcium Tablet Compliance Tracker — Post-Delivery (180 Days)","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_42.jpg"],[43,"p","Weekly IFA/Deworming Calendar, 6 Months–5 Years","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_43.jpg"],[44,"p","Anemia (Hemoglobin) Screening & IFA Dose Tracking, 6 Months–5 Years (Part 1)","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_44.jpg"],[45,"p","Anemia (Hemoglobin) Screening & IFA Dose Tracking, 6 Months–5 Years (Part 2)","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_45.jpg"],[46,"i","Family Planning Methods","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_46.jpg"],[47,"i","Anemia Prevention Diet & Financial Benefits/Schemes","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_47.jpg"],[48,"p","Pradhan Mantri Surakshit Matritva Abhiyan (PMSMA) Card — Clinical Examination Form","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_48.jpg"],[49,"i","SUMAN Charter — Assured Services List","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_49.jpg"],[50,"i","JSSK Helpline / Kilkari Information","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/page_ref_50.jpg"],[51,"i","Odisha MCH Schemes — JSY / JSSK / PMSMA / SUMAN / ICDS / POSHAN Abhiyaan","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/other_schemes.jpg"],[52,"p","Mamata (PMMVY) Scheme","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/mamata%28pmmvy%29_scheme.jpg"],[53,"i","NRC (Nutrition Rehabilitation Centre) — Beneficiary Financial Benefits (includes bilingual Odia/English Payment Table)","https://raw.githubusercontent.com/nandiniprava1952-spec/mcp/main/nrc_scheme.jpg"]]; // [number, 'p' = scan | 'i' = info only, title, reference image URL]
const $=s=>document.querySelector(s),NP=PAGES.filter(p=>p[1]=='p').length;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DB=new Promise((ok,no)=>{const r=indexedDB.open('mcp',1);r.onupgradeneeded=()=>r.result.createObjectStore('rec',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=no});
const tx=async(m,f)=>{const d=await DB;return new Promise((ok,no)=>{const t=d.transaction('rec',m),q=f(t.objectStore('rec'));t.oncomplete=()=>ok(q&&q.result);t.onerror=no})};
const all=()=>tx('readonly',s=>s.getAll()),put=r=>tx('readwrite',s=>s.put(r)),del=id=>tx('readwrite',s=>s.delete(id));
let R,urls=[];const U=b=>{const u=URL.createObjectURL(b);urls.push(u);return u};
const cnt=r=>Object.keys(r.photos).length;
const H=(t,b)=>{$('#ht').textContent=t;const k=$('#hbk');k.hidden=!b;if(b)k.href=b};
const M=h=>$('main').innerHTML=h;
const cap=(k,l)=>`<div class=row><label class=b>📷 ${l}<input type=file accept="image/*" capture=environment hidden onchange="take(this,'${k}')"></label><label class="b s">🖼 ${tr('gal')}<input type=file accept="image/*" ${k=='rx'?'multiple':''} hidden onchange="take(this,'${k}')"></label></div>`;

async function route(){urls.forEach(u=>URL.revokeObjectURL(u));urls=[];
 const[,,id,,n]=location.hash.split('/');R=id&&(await all()).find(x=>x.id==id);
 R?(n?pg(R,+n):rec(R)):home()}

async function home(){const rs=(await all()).sort((a,b)=>b.updated-a.updated);H(tr('app'));
 M(`<button class=b onclick=nw()>${tr('new')}</button>`+(rs.length?'':'<p class=mu>'+tr('empty')+'</p>')+
 rs.map(r=>`<a class=c href="#/r/${r.id}"><div><b>${esc(r.name)||tr('unn')}</b><span class=mu>${esc(r.date)} · ${tr('scn',cnt(r))}</span></div><em>›</em></a>`).join(''))}

async function nw(){const r={id:Date.now().toString(36),name:'',date:new Date().toISOString().slice(0,10),photos:{},rx:[],updated:Date.now()};
 await put(r);location.hash='#/r/'+r.id}

function rec(r){H(r.name||tr('nr'),'#/');
 M(`<label>${tr('nm')}<input id=nm value="${esc(r.name)}" autocomplete=off></label>
 <label>${tr('dt')}<input id=dt type=date value="${r.date}"></label>
 <h2>${tr('rxh')}</h2><div class=g>${r.rx.map((b,i)=>`<div class=t><img src="${U(b)}"><button onclick="rxrm(${i})">✕</button></div>`).join('')}</div>${cap('rx',tr('rxa'))}
 <h2>${tr('rp')} <span class=mu>${tr('sc',cnt(r))}</span></h2><progress max=${NP} value=${cnt(r)}></progress>
 ${PAGES.map(([n,t,ti])=>`<a class="c ${r.photos[n]?'ok':''}" href="#/r/${r.id}/p/${n}">${r.photos[n]?`<img src="${U(r.photos[n])}">`:`<i>${n}</i>`}<div><b>${tr('pg')} ${n}</b><span class=mu>${esc(ti)}</span></div><em>${t=='i'?'ℹ️':r.photos[n]?'✓':'📷'}</em></a>`).join('')}
 <button class=b onclick=exp()>${tr('ex')}</button><button class="b d" onclick=rm()>${tr('del')}</button>`);
 for(const[k,id]of[['name','nm'],['date','dt']])$('#'+id).onchange=e=>{r[k]=e.target.value;r.updated=Date.now();put(r)}}

function pg(r,n){const p=PAGES.find(x=>x[0]==n);if(!p)return rec(r);const[,t,ti,u]=p;H(tr('pg')+' '+n,'#/r/'+r.id);
 M(`<p><b>${esc(ti)}</b></p><a href="${u}" target=_blank rel=noopener><img class=ref crossorigin=anonymous src="${u}" alt="Reference image for page ${n}"></a><p class=mu>${tr('tap')}</p>`+
 (t=='i'?'<p class=note>'+tr('info')+'</p>':(r.photos[n]?`<h2>${tr('you')}</h2><img class=ref src="${U(r.photos[n])}">`:'')+cap(n,r.photos[n]?tr('ret'):tr('scp')))+
 `<div class=nav>${n>1?`<a class="b s" href="#/r/${r.id}/p/${n-1}">${tr('prv')}</a>`:'<span></span>'}${n<PAGES.length?`<a class="b s" href="#/r/${r.id}/p/${n+1}">${tr('nxt')}</a>`:'<span></span>'}</div>`)}

async function shrink(f){const im=await createImageBitmap(f,{imageOrientation:'from-image'}),s=Math.min(1,1800/Math.max(im.width,im.height)),c=document.createElement('canvas');
 c.width=im.width*s|0;c.height=im.height*s|0;c.getContext('2d').drawImage(im,0,0,c.width,c.height);return new Promise(ok=>c.toBlob(ok,'image/jpeg',.82))}
async function take(i,k){for(const f of i.files){const b=await shrink(f);k=='rx'?R.rx.push(b):R.photos[k]=b}R.updated=Date.now();await put(R);route()}
async function rxrm(i){R.rx.splice(i,1);await put(R);route()}
async function rm(){if(confirm(tr('cdel'))){await del(R.id);location.hash='#/'}}

const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=u=>{let c=-1;for(let i=0;i<u.length;i++)c=crcT[(c^u[i])&255]^(c>>>8);return(c^-1)>>>0};
function zip(files){const enc=new TextEncoder(),parts=[],cd=[];let off=0;
 for(const f of files){const nm=enc.encode(f.name),c=crc(f.data),n=f.data.length;
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);h.setUint32(14,c,true);h.setUint32(18,n,true);h.setUint32(22,n,true);h.setUint16(26,nm.length,true);parts.push(h.buffer,nm,f.data);
  const d=new DataView(new ArrayBuffer(46));d.setUint32(0,0x02014b50,true);d.setUint16(4,20,true);d.setUint16(6,20,true);d.setUint16(8,0x800,true);d.setUint32(16,c,true);d.setUint32(20,n,true);d.setUint32(24,n,true);d.setUint16(28,nm.length,true);d.setUint32(42,off,true);cd.push(d.buffer,nm);off+=30+nm.length+n}
 const cs=cd.reduce((a,b)=>a+b.byteLength,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cd,e.buffer],{type:'application/zip'})}

async function exp(){const buf=async b=>new Uint8Array(await b.arrayBuffer()),f=[];
 for(const n in R.photos)f.push({name:`page_${n.padStart(2,'0')}.jpg`,data:await buf(R.photos[n])});
 for(let i=0;i<R.rx.length;i++)f.push({name:`prescription_${i+1}.jpg`,data:await buf(R.rx[i])});

 try{const c=await caches.open(CN);let n=0;

 delete b.dataset.busy}
